<!doctype html>
<!--
  The page of the generated application, in ONE file: the HTML and, in the last
  <script> block, its JavaScript. Plain HTML and JavaScript: no framework, no build step.

  Filled by: the FRONTEND task.
  Served by: backend/main.py at /. Styled by frontend/style.css; frontend/lib.js gives
  ready helpers. Both are ready parts of the template: do not write them again.
  Relies on: the /api routes of backend/main.py.

  Visual style: the frontend task's description names one of the five themes of
  style.css (modern, midnight, warm, forest, mono). Keep that theme on the
  <html> tag (data-theme="...", modern when the description names none) and shape
  the page for its mood; style.css does the colors. Do not write your own colors.

  Rules for the layout (keep the shell structure of this file):
  - <aside class="sidebar"> with the brand (the application name) and <nav id="nav">
    with one <a href="#section-..."> per section (the lib.js scrollspy marks the
    active link); <div class="sidebar-foot"> may hold a small footer line.
  - <header class="pagehead">: <h1> with the application name, <p class="subtitle">
    with one line about what the app does, and .page-actions for global buttons.
  - <p id="message"> is a floating toast (do not move or restyle it).
  - First: <div class="stats"> with one <div class="card stat"> per important count
    of the requirement (<span id="stat-<things>">0</span><small><Things></small>);
    the single most important metric first with class="stat wide".
  - Then one <section class="panel" id="section-<things>"> per record type, each with:
      <div class="panel-head"> with <h2> and the search box
        <input id="search-<things>" type="search" placeholder="Search...">;
      the form id="form-<things>" (class="form-grid card-inset") whose inputs have
        name= the API field names, the right type (text, number, date, email, select,
        textarea, checkbox) and required where needed, a hidden <input name="id"> for
        editing, a submit button and a <button type="button" class="secondary"
        data-reset>Cancel</button>;
      and an empty <div id="list-<things>"></div> for the table.
  - Interface text in English; the page title and <h1> name the application.

  Rules for the JavaScript (in the last <script> block):
  - The helpers of lib.js:
      await api(path, { method: "POST", body: object })   JSON in and out; errors shown
      showMessage("Saved", "ok")
      renderTable("list-<things>", rows,
        [{ key: "title", label: "Title" },
         { key: "status", label: "Status", format: (v) => `<span class="badge">${escapeHtml(v)}</span>` }],
        [{ label: "Edit", kind: "secondary", run: (row) => fillForm(form, row) },
         { label: "Delete", kind: "danger", run: (row) => remove(row.id) }])
        (number columns get class "num" on the header for right alignment; status
        badges are colored by their text automatically)
      showSkeleton("list-<things>")   a shimmer while the first load runs; call it
        before the first api() call of each list, and hide it by rendering the table
      formData(form) -> object of the named inputs (numbers as numbers, no "id")
      fillForm(form, record), escapeHtml(value), debounce(run, ms)
      wireSearch("search-<things>", "/api/<things>", (rows) => renderTable(...))  — the
      search box calls the list route with ?search=...; use it instead of your own
      listener, so the search always filters the table
  - For every record type: a load function fills its table and the search box filters it
    (?search=... with wireSearch above); the form adds a record (POST) or, when its hidden
    id is set, updates it
    (PUT); Edit fills the form, Delete asks confirm() first; actions of the requirement are
    row buttons too. Show states and categories with <span class="badge">.
  - Select inputs that link to another record (for example <thing>_id) are filled from
    that record's list.
  - Call only routes of backend/main.py, with relative paths. After every change load the
    lists and /api/stats again. Load everything at start.
-->
<html lang="en" data-theme="modern">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Generated application</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">Generated application</div>
      <nav id="nav"></nav>
      <div class="sidebar-foot"></div>
    </aside>
    <div class="content">
      <header class="pagehead">
        <div>
          <h1>Generated application</h1>
          <p class="subtitle">one line about what the application does</p>
        </div>
        <div class="page-actions"></div>
      </header>
      <p id="message" role="status"></p>
      <!-- the stats, then one section per record type -->
    </div>
  </div>
  <script src="lib.js"></script>
  <script>
    // load functions, form handlers and row actions, then the first load
  </script>
</body>
</html>
