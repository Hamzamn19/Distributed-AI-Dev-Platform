<!doctype html>
<!--
  The page of the generated application: plain HTML, no framework, no build step.

  Filled by: the FRONTEND task (together with frontend/app.js).
  Served by: backend/main.py at http://localhost:8000/.
  Relies on: frontend/app.js, loaded at the end of <body>.

  Rules every agent follows:
  - One page. Give every list and form an id; app.js finds them with getElementById.
  - Show the records of the requirement in lists or tables, and a form for each action.
  - Keep an element with id="message" for errors and confirmations.
  - Interface text in English.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Generated application</title>
</head>
<body>
  <h1>Generated application</h1>
  <p id="message"></p>
  <!-- lists, tables and forms of the requirement -->
  <script src="app.js"></script>
</body>
</html>
