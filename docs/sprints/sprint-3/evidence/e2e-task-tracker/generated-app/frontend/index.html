<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Management Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .card { @apply bg-white p-6 rounded-lg shadow-md; }
        .btn-primary { @apply bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition; }
        .btn-danger { @apply bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700 transition; }
        .btn-secondary { @apply bg-gray-200 text-gray-700 px-4 py-2 rounded hover:bg-gray-300 transition; }
        .input-field { @apply border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 w-full; }
        .table-header { @apply bg-gray-50 text-left px-6 py-3 text-xs font-medium text-gray-500 uppercase tracking-wider; }
        .table-row { @apply border-b border-gray-200 hover:bg-gray-50 transition; }
    </style>
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal">

    <nav class="bg-blue-800 p-4 text-white shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">TaskMaster Pro</h1>
            <div id="connection-status" class="text-sm bg-blue-700 px-3 py-1 rounded">Connected</div>
        </div>
    </nav>

    <main class="container mx-auto mt-8 px-4 pb-12">
        <!-- Dashboard Stats -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="card border-l-4 border-blue-500">
                <h3 class="text-gray-500 text-sm font-semibold uppercase">Total Tasks</h3>
                <p id="stat-total" class="text-3xl font-bold text-gray-800">0</p>
            </div>
            <div class="card border-l-4 border-green-500">
                <h3 class="text-gray-500 text-sm font-semibold uppercase">Completed</h3>
                <p id="stat-completed" class="text-3xl font-bold text-gray-800">0</p>
            </div>
            <div class="card border-l-4 border-yellow-500">
                <h3 class="text-gray-500 text-sm font-semibold uppercase">Pending</h3>
                <p id="stat-pending" class="text-3xl font-bold text-gray-800">0</p>
            </div>
        </div>

        <!-- Task Management Section -->
        <div class="card">
            <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
                <h2 class="text-xl font-bold text-gray-800">Task Records</h2>
                <div class="flex gap-2 w-full md:w-auto">
                    <input type="text" id="search-input" placeholder="Search tasks..." class="input-field" oninput="app.filterTasks()">
                    <button onclick="app.openModal()" class="btn-primary whitespace-nowrap">+ New Task</button>
                </div>
            </div>

            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead>
                        <tr>
                            <th class="table-header">ID</th>
                            <th class="table-header">Title</th>
                            <th class="table-header">Status</th>
                            <th class="table-header">Priority</th>
                            <th class="table-header">Due Date</th>
                            <th class="table-header text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="task-table-body" class="bg-white divide-y divide-gray-200">
                        <!-- Rows injected by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Task Modal (Add/Edit) -->
    <div id="task-modal" class="fixed inset-0 z-50 hidden overflow-y-auto">
        <div class="flex items-center justify-center min-h-screen px-4">
            <div class="fixed inset-0 bg-black opacity-50"></div>
            <div class="bg-white rounded-lg shadow-xl transform transition-all sm:w-full max-w-lg m-auto">
                <div class="p-6">
                    <div class="flex justify-between items-center mb-4">
                        <h3 id="modal-title" class="text-lg font-bold text-gray-900">Add New Task</h3>
                        <button onclick="app.closeModal()" class="text-gray-400 hover:text-gray-600">&times;</button>
                    </div>
                    <form id="task-form" onsubmit="app.handleFormSubmit(event)">
                        <input type="hidden" id="task-id">
                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Title</label>
                                <input type="text" id="task-title" required class="input-field">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
                                <textarea id="task-desc" rows="3" class="input-field"></textarea>
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Status</label>
                                    <select id="task-status" class="input-field">
                                        <option value="pending">Pending</option>
                                        <option value="in-progress">In Progress</option>
                                        <option value="completed">Completed</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Priority</label>
                                    <select id="task-priority" class="input-field">
                                        <option value="low">Low</option>
                                        <option value="medium">Medium</option>
                                        <option value="high">High</option>
                                    </select>
                                </div>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Due Date</label>
                                <input type="date" id="task-date" required class="input-field">
                            </div>
                        </div>
                        <div class="mt-6 flex justify-end gap-3">
                            <button type="button" onclick="app.closeModal()" class="btn-secondary">Cancel</button>
                            <button type="submit" class="btn-primary">Save Task</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        const app = {
            tasks: [],
            filteredTasks: [],
            
            async init() {
                await this.fetchTasks();
            },

            async fetchTasks() {
                try {
                    const response = await fetch('/api/tasks');
                    this.tasks = await response.json();
                    this.filteredTasks = [...this.tasks];
                    this.render();
                } catch (err) {
                    console.error("Fetch error:", err);
                }
            },

            render() {
                this.renderStats();
                this.renderTable();
            },

            renderStats() {
                const total = this.tasks.length;
                const completed = this.tasks.filter(t => t.status === 'completed').length;
                const pending = total - completed;

                document.getElementById('stat-total').innerText = total;
                document.getElementById('stat-completed').innerText = completed;
                document.getElementById('stat-pending').innerText = pending;
            },

            renderTable() {
                const tbody = document.getElementById('task-table-body');
                const searchTerm = document.getElementById('search-input').value.toLowerCase();
                
                const displayList = this.tasks.filter(t => 
                    t.title.toLowerCase().includes(searchTerm) || 
                    t.description.toLowerCase().includes(searchTerm)
                );

                tbody.innerHTML = displayList.map(task => `
                    <tr class="table-row">
                        <td class="px-6 py-4 text-sm text-gray-500">#${task.id}</td>
                        <td class="px-6 py-4">
                            <div class="text-sm font-medium text-gray-900">${task.title}</div>
                            <div class="text-xs text-gray-500 truncate max-w-xs">${task.description}</div>
                        </td>
                        <td class="px-6 py-4">
                            <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full 
                                ${this.getStatusClass(task.status)}">
                                ${task.status}
                            </span>
                        </td>
                        <td class="px-6 py-4 text-sm text-gray-500">${task.priority}</td>
                        <td class="px-6 py-4 text-sm text-gray-500">${task.dueDate}</td>
                        <td class="px-6 py-4 text-right text-sm font-medium">
                            <button onclick="app.editTask(${task.id})" class="text-blue-600 hover:text-blue-900 mr-3">Edit</button>
                            <button onclick="app.deleteTask(${task.id})" class="text-red-600 hover:text-red-900">Delete</button>
                        </td>
                    </tr>
                `).join('');
            },

            getStatusClass(status) {
                switch(status) {
                    case 'completed': return 'bg-green-100 text-green-800';
                    case 'in-progress': return 'bg-blue-100 text-blue-800';
                    default: return 'bg-yellow-100 text-yellow-800';
                }
            },

            filterTasks() {
                this.renderTable();
            },

            openModal(isEdit = false) {
                const modal = document.getElementById('task-modal');
                const title = document.getElementById('modal-title');
                const form = document.getElementById('task-form');
                
                form.reset();
                document.getElementById('task-id').value = '';
                
                if (isEdit) {
                    title.innerText = "Edit Task";
                } else {
                    title.innerText = "Add New Task";
                }
                
                modal.classList.remove('hidden');
            },

            closeModal() {
                document.getElementById('task-modal').classList.add('hidden');
            },

            async editTask(id) {
                const task = this.tasks.find(t => t.id === id);
                if (!task) return;

                this.openModal(true);
                document.getElementById('task-id').value = task.id;
                document.getElementById('task-title').value = task.title;
                document.getElementById('task-desc').value = task.description;
                document.getElementById('task-status').value = task.status;
                document.getElementById('task-priority').value = task.priority;
                document.getElementById('task-date').value = task.dueDate;
            },

            async handleFormSubmit(e) {
                e.preventDefault();
                const id = document.getElementById('task-id').value;
                const payload = {
                    title: document.getElementById('task-title').value,
                    description: document.getElementById('task-desc').value,
                    status: document.getElementById('task-status').value,
                    priority: document.getElementById('task-priority').value,
                    dueDate: document.getElementById('task-date').value
                };

                try {
                    const url = id ? `/api/tasks/${id}` : '/api/tasks';
                    const method = id ? 'PUT' : 'POST';
                    
                    const res = await fetch(url, {
                        method: method,
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (res.ok) {
                        this.closeModal();
                        await this.fetchTasks();
                        Swal.fire('Success!', 'Task saved.', 'success');
                    } else {
                        throw new Error('Save failed');
                    }
                } catch (err) {
                    Swal.fire('Error', 'Could not save task.', 'error');
                }
            },

            async deleteTask(id) {
                const result = await Swal.fire({
                    title: 'Are you sure?',
                    text: "You won't be able to undo this!",
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#d33',
                    cancelButtonColor: '#3085d6',
                    confirmButtonText: 'Yes, delete it!'
                });

                if (result.isConfirmed) {
                    try {
                        const res = await fetch(`/api/tasks/${id}`, { method: 'DELETE' });
                        if (res.ok) {
                            await this.fetchTasks();
                            Swal.fire('Deleted!', 'Task has been removed.', 'success');
                        }
                    } catch (err) {
                        Swal.fire('Error', 'Delete failed.', 'error');
                    }
                }
            }
        };

        // Start the app
        document.addEventListener('DOMContentLoaded', () => app.init());
    </script>
</body>
</html>
