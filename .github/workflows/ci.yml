name: ci-pipeline

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install flask requests pytest
      - name: Run Smoke Tests & API Checks
        run: |
          python3 app.py &
          # Sunucunun ayağa kalkması için sağlık kontrolü döngüsü (Health check retry)
          for i in {1..10}; do
            curl -s http://localhost:5000/health && break
            echo "Flask sunucusunun açılması bekleniyor..."
            sleep 1
          done
          python3 scripts/seed_agents.py
          python3 scripts/smoke_test.py
