name: CI

# Runs the Python tests and builds the web interface on every push to a
# feature branch or main, and on every pull request into main.
on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11 (the oldest version the contract allows)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Run pytest (LLM_MOCK=1 is set by tests/conftest.py)
        run: pytest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the web interface (type check + build)
        working-directory: frontend
        run: |
          npm ci
          npm run build
